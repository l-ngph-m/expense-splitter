name: Build jlink images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven

      - name: Build jlink image
        run: mvn javafx:jlink

      - name: Create launcher scripts
        shell: bash
        run: |
          cd target/expense-splitter
          cat > expense-splitter.bat << 'BAT'
@echo off
cd /d "%~dp0"
"bin\java" -m expense.splitter/org.Main %*
if errorlevel 1 (
    echo.
    echo Application exited with code %errorlevel%
    pause
)
BAT
          cat > expense-splitter.sh << 'SH'
#!/usr/bin/env bash
DIR="$(cd "$(dirname "$0")" && pwd)"
exec "$DIR/bin/java" -m expense.splitter/org.Main "$@"
SH
          chmod +x expense-splitter.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense-splitter-${{ runner.os }}
          path: target/expense-splitter/
